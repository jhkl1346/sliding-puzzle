# 코드를 올리거나 PR을 열 때마다 포맷·린트·테스트·빌드를 자동으로 검사한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 서버 API 테스트용 임시 PostgreSQL. 검사가 끝나면 사라진다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # 테스트는 이름이 _test로 끝나는 DB에서만 돈다. (개발 DB 보호 장치)
          POSTGRES_DB: sliding_puzzle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sliding_puzzle_test
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sliding_puzzle_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 포맷 검사
        run: npm run format:check

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build
